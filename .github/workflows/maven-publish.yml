# This workflow publishes a Maven package only when a GitHub Release is published.
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  release:
    types: [published]

jobs:
  publish:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Validate package version
      run: |
        RELEASE_TAG="${{ github.event.release.tag_name }}"

        if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Release tag must follow the format vMAJOR.MINOR.PATCH, for example v1.0.0."
          exit 1
        fi

        POM_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
        TAG_VERSION="${RELEASE_TAG#v}"

        if [[ "$POM_VERSION" == *-SNAPSHOT ]]; then
          echo "The pom.xml version must be a release version, not SNAPSHOT. Current version: $POM_VERSION"
          exit 1
        fi

        if [[ "$POM_VERSION" != "$TAG_VERSION" ]]; then
          echo "The tag version ($TAG_VERSION) must match the pom.xml version ($POM_VERSION)."
          exit 1
        fi

    - name: Build and publish to GitHub Packages Apache Maven
      run: mvn -B deploy -s $GITHUB_WORKSPACE/settings.xml
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
